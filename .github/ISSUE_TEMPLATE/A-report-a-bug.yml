name: Report a bug
description: Something does not work in a function, a lesson or the website.
title: "[Bug]: "
labels: ["bug"]
assignees:
  - EveliaCoss
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it! A reproducible example makes it easier to find the bug.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. If it is in a lesson, say which one and in which section.
    validations:
      required: true
  - type: textarea
    id: reprex
    attributes:
      label: Code to reproduce it
      description: A minimal example, preferably made with [reprex](https://reprex.tidyverse.org/) (`reprex::reprex()`).
      render: r
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: session
    attributes:
      label: Your R session information
      description: Paste the output of `sessionInfo()` here.
      render: text
