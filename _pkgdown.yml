url: https://eveliacoss.github.io/GeneExprLupusMx/

template:
  bootstrap: 5
  bootswatch: flatly
  #light-switch: true # boton de prender y apagar light/dark theme
  opengraph:
    image:
      src: man/figures/overview.png
      alt: "GeneExprLupusMx: transcriptómica de lupus en mujeres mexicanas"
destination: pkgdown

lang: es # Lenguaje de Español por default

authors:
  Evelia Coss:
    href: https://eveliacoss.github.io/

navbar:
  structure:
    left:  [home, intro, articles, download, reference, changelog]
    right: [search, github, lightswitch]
  components:

    home:
      icon: fa-home
      href: index.html
      aria-label: Inicio

    intro:
      text: Getting started
      menu:
      - text: ES - Primeros pasos con el paquete GeneExprLupusMx
        href: articles/intro_es.html
      - text: EN - Get started with GeneExprLupusMx
        href: articles/intro_en.html

    articles:
      text: "Artículos"
      menu:
        - text: "ES - Tutoriales en español"
        - text: "1 - Conociendo a las participantes"
          href: articles/clinical_es.html
        - text: "2 - De las cuentas de RNA-seq a la exploración de datos"
          href: articles/intro_RNAseq_es.html
        - text: "3 - Genes diferencialmente expresados entre pacientes y controles"
          href: articles/l3_DEGs_es.html
        - text: "4 - Funciones biológicas de los genes diferencialmente expresados"
          href: articles/l4_GOterms_es.html
        - text: "5 - Diferenciación de monocitos a células dendríticas"
          href: articles/l5_DEGs_monocytes_diff_es.html
        - text: "6 - La firma transcripcional de las células dendríticas tolerogénicas"
          href: articles/l6_DEGs_tolDcs_es.html
        - text: "7 - ¿Se diferencian igual las células de pacientes y controles?"
          href: articles/l7_DEGs_between_groups_es.html
        - text: -------   # separador visual
        - text: "EN - Tutorials in English"
        - text: "1 - Meeting the participants"
          href: articles/clinical_en.html
        - text: "2 - From RNA-seq counts to data exploration"
          href: articles/intro_RNAseq_en.html
        - text: "3 - Differentially expressed genes between patients and controls"
          href: articles/l3_DEGs_en.html
        - text: "4 - Biological functions of differentially expressed genes"
          href: articles/l4_GOterms_en.html
        - text: "5 - Differentiation of monocytes into dendritic cells"
          href: articles/l5_DEGs_monocytes_diff_en.html
        - text: "6 - The transcriptional signature of tolerogenic dendritic cells"
          href: articles/l6_DEGs_tolDcs_en.html
        - text: "7 - Do patient and control cells differentiate in the same way?"
          href: articles/l7_DEGs_between_groups_en.html

    download:
      text: "Descarga de datos"
      menu:
      - text: "ES - Descarga de datos"
        href: articles/download_es.html
      - text: "EN - Data download"
        href: articles/download_en.html

    changelog:
      text: "Registro de cambios"
      menu:
      - text: "ES - Registro de cambios"
        href: articles/news_es.html
      - text: "EN - Changelog"
        href: news/index.html
