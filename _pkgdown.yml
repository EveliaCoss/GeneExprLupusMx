url: https://eveliacoss.github.io/GeneExprLupusMx/

template:
  bootstrap: 5
  bootswatch: flatly
  # Paleta de overview_promo.png
  bslib:
    primary: "#3D3F8F"            # franja inferior de la imagen
    navbar-bg: "#3D3F8F"
    body-color: "#14164D"         # azul marino del texto
    link-color: "#007F99"         # mismo color que los títulos
    link-hover-color: "#005F73"
    border-color: "#DFE2FB"
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;700&display=swap" rel="stylesheet">
      <style>
        /* Títulos del contenido (no afecta al menú ni a la barra lateral) */
        main h1, main h2, main h3, main h4, main h5, main h6 {
          font-family: "News Cycle", "Arial Narrow Bold", sans-serif !important;
          font-weight: 700 !important;
          line-height: 1.1 !important;
          color: #007f99;
        }
        /* Código dentro del texto (p. ej., dplyr/ggplot2) con el mismo color que el código de los enlaces */
        main :not(pre) > code { color: #007f99; }
        /* Línea al inicio de cada página (debajo del título y de "Código: ...") */
        main .page-header { border-bottom: 6px solid #007f99; }
        /* Citas (texto con >) en amarillo claro de la paleta */
        main blockquote {
          background: #FCF5D9;
          border-left: 5px solid #F2D77A;
          border-radius: .25rem;
          padding: .75rem 1rem;
          margin: 1rem 0;
          color: #14164D;
        }
        main blockquote > :last-child { margin-bottom: 0; }
        /* Recuadro rojo para pendientes (p. ej., DOI del paquete) */
        main .callout-pending { border: 1px solid #E05252; border-left-width: 5px; border-radius: .25rem; padding: .75rem 1rem; margin: 1rem 0; background: #FDECEC; color: #14164D; }
        main .callout-pending > :last-child { margin-bottom: 0; }
        main .callout-pending strong:first-child { color: #B42318; }
      </style>
  #light-switch: true # boton de prender y apagar light/dark theme
  opengraph:
    image:
      src: man/figures/overview_promo_en.png
      alt: "GeneExprLupusMx overview: data, workflow, key findings and lessons"
destination: pkgdown
llm-docs: false # no generar copias .md del sitio: pkgdown/index.md tapaba a index.md como fuente de la página de inicio

lang: es # Lenguaje de Español por default

authors:
  Evelia Coss:
    href: https://eveliacoss.github.io/

navbar:
  bg: primary
  type: dark
  structure:
    left:  [home, intro, articles, functions, download, reference, changelog]
    right: [search, github, lightswitch]
  components:

    home:
      icon: fa-home
      href: index.html
      aria-label: Inicio

    intro:
      text: Getting started
      menu:
      - text: ES - Primeros pasos con el paquete GeneExprLupusMx
        href: articles/intro_es.html
      - text: EN - Get started with GeneExprLupusMx
        href: articles/intro_en.html

    articles:
      text: "Tutoriales"
      menu:
        - text: "ES - Tutoriales en español"
        - text: "1 - Conociendo a las participantes"
          href: articles/clinical_es.html
        - text: "2 - De las cuentas de RNA-seq a la exploración de datos"
          href: articles/intro_RNAseq_es.html
        - text: "3 - Genes diferencialmente expresados entre pacientes y controles"
          href: articles/l3_DEGs_es.html
        - text: "4 - Funciones biológicas de los genes diferencialmente expresados"
          href: articles/l4_GOterms_es.html
        - text: "5 - Diferenciación de monocitos a células dendríticas"
          href: articles/l5_DEGs_monocytes_diff_es.html
        - text: "6 - La firma transcripcional de las células dendríticas tolerogénicas"
          href: articles/l6_DEGs_tolDcs_es.html
        - text: "7 - ¿Se diferencian igual las células de pacientes y controles?"
          href: articles/l7_DEGs_between_groups_es.html
        - text: -------   # separador visual
        - text: "EN - Tutorials in English"
        - text: "1 - Meeting the participants"
          href: articles/clinical_en.html
        - text: "2 - From RNA-seq counts to data exploration"
          href: articles/intro_RNAseq_en.html
        - text: "3 - Differentially expressed genes between patients and controls"
          href: articles/l3_DEGs_en.html
        - text: "4 - Biological functions of differentially expressed genes"
          href: articles/l4_GOterms_en.html
        - text: "5 - Differentiation of monocytes into dendritic cells"
          href: articles/l5_DEGs_monocytes_diff_en.html
        - text: "6 - The transcriptional signature of tolerogenic dendritic cells"
          href: articles/l6_DEGs_tolDcs_en.html
        - text: "7 - Do patient and control cells differentiate in the same way?"
          href: articles/l7_DEGs_between_groups_en.html

    functions:
      text: "Funciones"
      menu:
      - text: "ES - Cómo usar las funciones del paquete"
        href: articles/functions_es.html
      - text: "EN - How to use the package functions"
        href: articles/functions_en.html

    download:
      text: "Descarga de datos"
      menu:
      - text: "ES - Descarga de datos"
        href: articles/download_es.html
      - text: "EN - Data download"
        href: articles/download_en.html

    changelog:
      text: "Registro de cambios"
      menu:
      - text: "ES - Registro de cambios"
        href: articles/news_es.html
      - text: "EN - Changelog"
        href: news/index.html
